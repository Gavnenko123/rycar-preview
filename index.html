<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хроники Азерота · пёс Калимдора</title>
<style>
  :root {
    --bg: #0c0a09; --panel: #1c1917; --panel2: #292524; --border: #44403c;
    --amber: #f59e0b; --amber-dim: #b45309; --rose: #e11d48; --sky: #0ea5e9;
    --emerald: #10b981; --violet: #a78bfa; --stone: #a8a29e; --muted: #78716c; --txt: #e7e5e4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg); color: var(--txt);
    min-height: 100vh; line-height: 1.55;
  }
  .wrapper {
    min-height: 100vh; display: flex; flex-direction: column;
    background:
      radial-gradient(circle at 50% 0%, rgba(180,83,9,0.07), transparent 60%),
      linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0.7));
  }
  header {
    border-bottom: 1px solid rgba(180,83,9,0.3);
    background: rgba(12,10,9,0.85); backdrop-filter: blur(8px);
    padding: 0.75rem 1rem; position: sticky; top: 0; z-index: 20;
  }
  .header-inner {
    max-width: 1000px; margin: 0 auto; display: flex;
    align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;
  }
  .logo { display: flex; align-items: center; gap: 0.6rem; }
  .logo-mark {
    width: 2.2rem; height: 2.2rem; border: 1px solid var(--amber-dim); border-radius: 0.5rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; color: var(--amber); background: rgba(245,158,11,0.08);
  }
  h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: 0.02em; }
  .sub { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .sync { display: flex; align-items: center; gap: 0.5rem; font-size: 0.72rem; color: var(--muted); }
  .sync-dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--muted); transition: background .3s; }
  .sync-dot.ok { background: var(--emerald); box-shadow: 0 0 6px rgba(16,185,129,0.7); }
  .sync-dot.err { background: var(--rose); box-shadow: 0 0 6px rgba(225,29,72,0.7); }
  .refresh-btn {
    background: var(--panel2); border: 1px solid var(--border); color: var(--stone);
    border-radius: 0.4rem; padding: 0.25rem 0.55rem; cursor: pointer; font-size: 0.8rem;
  }
  .refresh-btn:hover { color: var(--amber); border-color: var(--amber-dim); }
  main { max-width: 1000px; width: 100%; margin: 0 auto; padding: 1.25rem 1rem 2.5rem; flex: 1; }
  .error-banner {
    display: none; background: rgba(225,29,72,0.12); border: 1px solid rgba(225,29,72,0.4);
    color: #fda4af; padding: 0.6rem 0.8rem; border-radius: 0.5rem; font-size: 0.8rem; margin-bottom: 1rem;
  }
  .status {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.6rem; margin-bottom: 1.1rem;
  }
  .stat-box { background: var(--panel); border: 1px solid var(--border); border-radius: 0.6rem; padding: 0.6rem 0.8rem; }
  .stat-box.wide { grid-column: 1 / -1; }
  .stat-box-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 0.2rem; }
  .stat-box-val { font-size: 0.95rem; }
  .char-note { font-size: 0.76rem; color: var(--stone); font-style: italic; margin-top: 0.25rem; }
  .hp-bar { height: 0.35rem; background: var(--panel2); border: 1px solid var(--border); border-radius: 2px; margin-top: 0.4rem; overflow: hidden; }
  .hp-fill { height: 100%; background: linear-gradient(90deg, var(--rose), #fb7185); transition: width .4s; }
  .layout { display: grid; grid-template-columns: 1.7fr 1fr; gap: 1rem; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1rem; }
  .section-title {
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--amber);
    margin-bottom: 0.85rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
  }
  .count { font-size: 0.66rem; color: var(--muted); letter-spacing: 0.05em; }
  .log-item { border-left: 2px solid var(--amber-dim); padding: 0.15rem 0 0.15rem 0.85rem; margin-bottom: 1.05rem; }
  .log-item:last-child { margin-bottom: 0; }
  .log-item.player { border-left-color: var(--sky); }
  .log-item.system { border-left-color: var(--violet); }
  .log-tag { display: flex; gap: 0.5rem; align-items: baseline; flex-wrap: wrap; margin-bottom: 0.3rem; }
  .day-badge {
    font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber);
    background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.25);
    padding: 0.1rem 0.45rem; border-radius: 0.3rem;
  }
  .role-badge { font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .log-text { font-size: 0.92rem; white-space: pre-wrap; }
  .item { display: flex; gap: 0.7rem; padding: 0.65rem 0; border-top: 1px dashed rgba(68,64,60,0.6); }
  .item:first-of-type { border-top: none; padding-top: 0; }
  .item-dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; margin-top: 0.45rem; flex-shrink: 0; }
  .item-head { display: flex; align-items: baseline; gap: 0.45rem; flex-wrap: wrap; }
  .item-name { font-size: 0.9rem; font-weight: 600; }
  .item-qty { font-size: 0.7rem; color: var(--muted); }
  .eq-badge {
    font-size: 0.56rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--emerald);
    border: 1px solid rgba(16,185,129,0.35); padding: 0 0.35rem; border-radius: 0.3rem;
  }
  .item-desc { font-size: 0.76rem; color: var(--muted); font-style: italic; margin-top: 0.15rem; }
  .item-stats { font-size: 0.7rem; color: var(--amber-dim); font-family: ui-monospace, 'Courier New', monospace; margin-top: 0.2rem; }
  .empty { color: var(--muted); font-size: 0.85rem; font-style: italic; }
  footer {
    border-top: 1px solid rgba(180,83,9,0.25); margin-top: auto;
    padding: 0.9rem 1rem calc(0.9rem + env(safe-area-inset-bottom));
    text-align: center; font-size: 0.7rem; color: var(--muted);
  }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="header-inner">
      <div class="logo">
        <div class="logo-mark">⚔</div>
        <div>
          <h1>Хроники Азерота</h1>
          <div class="sub">пёс Калимдора · саванна Калимдора</div>
        </div>
      </div>
      <div class="sync">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncText">синхронизация…</span>
        <button class="refresh-btn" onclick="loadAll()" aria-label="Обновить данные">↻</button>
      </div>
    </div>
  </header>

  <main>
    <div id="error" class="error-banner" role="alert"></div>

    <section class="status" id="status" aria-label="Краткий статус героя"></section>

    <div class="layout">
      <section class="card" aria-label="Хроника событий">
        <div class="section-title">📜 Хроника <span class="count" id="logCount"></span></div>
        <div id="log"><div class="empty">Загрузка хроники…</div></div>
      </section>

      <aside>
        <section class="card" aria-label="Инвентарь">
          <div class="section-title">🎒 Инвентарь <span class="count" id="invCount"></span></div>
          <div id="inv"><div class="empty">Загрузка инвентаря…</div></div>
        </section>
      </aside>
    </div>
  </main>

  <footer>
    Заметки кампании ведёт мастер · данные синхронизируются с GitHub · <span id="updatedAt">—</span>
  </footer>
</div>

<script>
  const STATE_URL = 'https://raw.githubusercontent.com/Gavnenko123/rycar-preview/main/state.json';
  const MESSAGES_URL = 'https://raw.githubusercontent.com/Gavnenko123/rycar-preview/main/messages.json';
  const ROLE_LABELS = { narrator: 'Мастер', gm: 'Мастер', player: 'Герой', system: 'Система', npc: 'НИП' };
  const RARITY_COLORS = { common: '#a8a29e', uncommon: '#10b981', rare: '#0ea5e9', epic: '#a78bfa', legendary: '#f59e0b' };

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderStatus(s) {
    const hpPct = s.maxHp ? Math.max(0, Math.min(100, Math.round((s.hp / s.maxHp) * 100))) : 0;
    const boxes = [
      `<div class="stat-box wide">
         <div class="stat-box-label">Герой</div>
         <div class="stat-box-val">${escapeHtml(s.characterName || 'Безымянный')} <span style="color:var(--muted);font-size:.75rem">· ур. ${escapeHtml(s.level)}</span></div>
         ${s.characterNote ? `<div class="char-note">${escapeHtml(s.characterNote)}</div>` : ''}
       </div>`,
      `<div class="stat-box">
         <div class="stat-box-label">Жизнь</div>
         <div class="stat-box-val">${escapeHtml(s.hp)} / ${escapeHtml(s.maxHp)}</div>
         <div class="hp-bar"><div class="hp-fill" style="width:${hpPct}%"></div></div>
       </div>`,
      `<div class="stat-box">
         <div class="stat-box-label">Монеты</div>
         <div class="stat-box-val" style="color:var(--amber)">${escapeHtml(s.gold)} 💰</div>
       </div>`,
      `<div class="stat-box">
         <div class="stat-box-label">Время</div>
         <div class="stat-box-val">День ${escapeHtml(s.day)} · ${escapeHtml(s.dayTime || '—')}</div>
       </div>`,
      `<div class="stat-box">
         <div class="stat-box-label">Локация</div>
         <div class="stat-box-val" style="font-size:.85rem">${escapeHtml(s.location || '—')}</div>
       </div>`
    ];
    document.getElementById('status').innerHTML = boxes.join('');
    if (s.updatedAt) {
      const d = new Date(s.updatedAt);
      document.getElementById('updatedAt').textContent = 'обновлено: ' + d.toLocaleString('ru-RU');
    }
  }

  function renderLog(messages) {
    const box = document.getElementById('log');
    if (!messages || !messages.length) {
      box.innerHTML = '<div class="empty">Хроника пуста.</div>';
      document.getElementById('logCount').textContent = '0 записей';
      return;
    }
    document.getElementById('logCount').textContent = messages.length + ' записей';
    const items = [...messages].reverse().map(m => {
      const role = ROLE_LABELS[m.role] || m.role;
      const cls = m.role === 'player' ? 'player' : (m.role === 'system' ? 'system' : '');
      const tag = m.tag ? `<span class="day-badge">${escapeHtml(m.tag)}</span>` : '';
      return `<article class="log-item ${cls}">
        <div class="log-tag">${tag}<span class="role-badge">${escapeHtml(role)}</span></div>
        <div class="log-text">${escapeHtml(m.content)}</div>
      </article>`;
    }).join('');
    box.innerHTML = items;
  }

  function renderInventory(inv) {
    const box = document.getElementById('inv');
    if (!inv || !inv.length) {
      box.innerHTML = '<div class="empty">Пусто. Даже карманы вывернули.</div>';
      document.getElementById('invCount').textContent = '0 предметов';
      return;
    }
    document.getElementById('invCount').textContent = inv.length + ' предметов';
    box.innerHTML = inv.map(it => {
      const color = RARITY_COLORS[it.rarity] || RARITY_COLORS.common;
      const qty = it.quantity && it.quantity > 1 ? `<span class="item-qty">×${escapeHtml(it.quantity)}</span>` : '';
      const eq = it.equipped ? '<span class="eq-badge">надето</span>' : '';
      const stats = it.stats ? `<div class="item-stats">${escapeHtml(it.stats)}</div>` : '';
      const desc = it.description ? `<div class="item-desc">${escapeHtml(it.description)}</div>` : '';
      return `<div class="item">
        <div class="item-dot" style="background:${color}"></div>
        <div style="flex:1">
          <div class="item-head"><span class="item-name">${escapeHtml(it.name)}</span>${qty}${eq}</div>
          ${desc}${stats}
        </div>
      </div>`;
    }).join('');
  }

  function setSync(state, text) {
    const dot = document.getElementById('syncDot');
    dot.className = 'sync-dot ' + (state || '');
    document.getElementById('syncText').textContent = text;
  }

  function showError(msg) {
    const e = document.getElementById('error');
    if (msg) { e.style.display = 'block'; e.textContent = msg; }
    else { e.style.display = 'none'; }
  }

  async function fetchJson(url) {
    const res = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  async function loadAll() {
    setSync('', 'синхронизация…');
    try {
      const [state, messages] = await Promise.all([fetchJson(STATE_URL), fetchJson(MESSAGES_URL)]);
      renderStatus(state);
      renderLog(messages);
      renderInventory(state.inventory || []);
      showError('');
      setSync('ok', 'синхронизировано');
    } catch (err) {
      setSync('err', 'ошибка связи');
      showError('Не удалось загрузить данные кампании: ' + err.message + '. Попробуй обновить позже.');
    }
  }

  loadAll();
  setInterval(loadAll, 90000);
</script>
</body>
</html>
